[workspace]
resolver = "2"
members = ["crates/libsy-conform"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dio/switchyard-capi"
rust-version = "1.85"

[workspace.dependencies]
# Pinned to the revision recorded in testdata/corpus/PIN.
switchyard-libsy = { git = "https://github.com/NVIDIA-NeMo/Switchyard.git", rev = "5ec826210d5dff632af51ccac4f858769f902ef1" }
switchyard-protocol = { git = "https://github.com/NVIDIA-NeMo/Switchyard.git", rev = "5ec826210d5dff632af51ccac4f858769f902ef1" }

anyhow = "1"
futures = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
