name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Respects rust-toolchain.toml (pinned to the channel the pinned
      # Switchyard revision requires).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: fmt
        run: make fmt-check
      - name: clippy
        run: make clippy
      - name: rust tests (harness + C ABI)
        run: make cargo-test
      - name: library tests
        run: make go-test
      - name: example tests (Envoy callout seam)
        run: make examples-test
      # Re-runs the oracle against the corpus and diffs the recorded golden.
      # Green means the oracle is deterministic and upstream behaviour has not
      # moved for the pinned revision.
      - name: conform (oracle)
        run: make verify
      # Diffs the tier-0/1 Go port against the same golden.
      - name: conform (tier 0/1 Go port)
        run: make impl
      # And the same corpus driven through libsy's C ABI: two backends, one golden.
      - name: conform (libsy via C ABI)
        run: make impl-capi
