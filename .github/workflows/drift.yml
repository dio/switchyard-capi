name: drift

# Scheduled early-warning. Two questions, both reported:
#   A. has upstream Switchyard behaviour moved since the pin?
#   B. has our own port drifted from upstream?
# B is the actionable one — it names the turns libsygo would now route
# differently — and measuring it needs the Go toolchain, since the port is Go.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Check upstream and port drift
        id: drift
        run: |
          chmod +x scripts/drift-check.sh
          scripts/drift-check.sh drift-report.txt
          echo "status=clean" >> "$GITHUB_OUTPUT" || true
        continue-on-error: true
      - name: Publish report to job summary
        if: always()
        run: cat drift-report.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.txt
      # Fail the job so drift is visible in the Actions list, but only after the
      # report has been published.
      - name: Fail on drift
        if: steps.drift.outcome == 'failure'
        run: exit 1
